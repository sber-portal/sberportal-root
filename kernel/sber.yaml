# Lima VM для сборки ядра SberPortal (Amlogic g12b, 4.9.268) с x86_64 Linaro GCC 6.3.1 через Rosetta.
vmType: "vz"
arch: "aarch64"
rosetta:
  enabled: true
  binfmt: true
cpus: 8
memory: "12GiB"
disk: "80GiB"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true
mountType: "virtiofs"
containerd:
  system: false
  user: false
